<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED / CHEIKH REPOSITORIES</title>
    <style>
        /* ============================================
           THEMES CONFIGURATION
           ============================================ */
        :root {
            /* Midnight Neon (Default) */
            --bg-primary: #0a0a14;
            --bg-card: #1a1a2e;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --accent-1: #a855f7;
            --accent-2: #06b6d4;
            --border-color: rgba(168, 85, 247, 0.25);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
            --header-gradient: linear-gradient(135deg, #c084fc, #06b6d4);
            --button-bg: linear-gradient(135deg, #a855f7, #06b6d4);
            --button-text: #ffffff;
            --font-heading: 'Georgia', serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --card-visual-bg: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(6, 182, 212, 0.15));
            --touch-line-gradient: linear-gradient(90deg, #a855f7, #06b6d4, #f43f5e);
        }

        /* Frosted Glass */
        [data-theme="frosted"] {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-1: #8b5cf6;
            --accent-2: #ec4899;
            --border-color: #e2e8f0;
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.06);
            --header-gradient: linear-gradient(135deg, #6d28d9, #ec4899);
            --button-bg: linear-gradient(135deg, #8b5cf6, #ec4899);
            --button-text: #ffffff;
            --card-visual-bg: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            --touch-line-gradient: linear-gradient(90deg, #8b5cf6, #ec4899, #3b82f6);
        }

        /* Neo Brutalism */
        [data-theme="brutalist"] {
            --bg-primary: #f5f0e8;
            --bg-card: #ffffff;
            --text-primary: #111111;
            --text-secondary: #333333;
            --accent-1: #ff3d00;
            --accent-2: #0066ff;
            --border-color: #111111;
            --shadow-card: 6px 6px 0px #111111;
            --header-gradient: linear-gradient(135deg, #111111, #111111);
            --button-bg: #ff3d00;
            --button-text: #ffffff;
            --card-visual-bg: #f5f0e8;
            --touch-line-gradient: linear-gradient(90deg, #ff3d00, #0066ff, #00e676);
            --font-heading: 'Impact', 'Arial Black', sans-serif;
        }

        /* Elegant Light */
        [data-theme="elegant"] {
            --bg-primary: #faf7f2;
            --bg-card: #ffffff;
            --text-primary: #2c2420;
            --text-secondary: #6b5d54;
            --accent-1: #c4a265;
            --accent-2: #8b7355;
            --border-color: #e8e0d5;
            --shadow-card: 0 10px 40px rgba(139, 115, 85, 0.08);
            --header-gradient: linear-gradient(135deg, #2c2420, #8b7355);
            --button-bg: #c4a265;
            --button-text: #ffffff;
            --card-visual-bg: #fdfbf7;
            --touch-line-gradient: linear-gradient(90deg, #c4a265, #e6c594, #8b7355);
        }

        /* Cyberpunk */
        [data-theme="cyberpunk"] {
            --bg-primary: #0d0015;
            --bg-card: #1a0025;
            --text-primary: #00f0ff;
            --text-secondary: #b8a0cc;
            --accent-1: #ff00e6;
            --accent-2: #00f0ff;
            --border-color: #ff00e6;
            --shadow-card: 0 0 20px rgba(255, 0, 230, 0.25);
            --header-gradient: linear-gradient(90deg, #ff00e6, #00f0ff);
            --button-bg: linear-gradient(90deg, #ff00e6, #00f0ff);
            --button-text: #0d0015;
            --card-visual-bg: repeating-linear-gradient(45deg, #1a0025, #1a0025 10px, #250038 10px, #250038 20px);
            --touch-line-gradient: linear-gradient(90deg, #ff00e6, #00f0ff, #ffe600);
            --font-heading: 'Courier New', monospace;
        }

        /* Galactic Ocean */
        [data-theme="ocean"] {
            --bg-primary: #020b14;
            --bg-card: #0a1929;
            --text-primary: #e2f1ff;
            --text-secondary: #8bb0d1;
            --accent-1: #007fff;
            --accent-2: #00e5ff;
            --border-color: rgba(0, 127, 255, 0.3);
            --shadow-card: 0 10px 30px rgba(0, 127, 255, 0.2);
            --header-gradient: linear-gradient(135deg, #007fff, #00e5ff);
            --button-bg: #007fff;
            --button-text: #ffffff;
            --card-visual-bg: linear-gradient(180deg, #0d2136, #0a1929);
            --touch-line-gradient: linear-gradient(90deg, #007fff, #00e5ff, #7000ff);
        }

        /* Sunset Glow */
        [data-theme="sunset"] {
            --bg-primary: #1a0b0d;
            --bg-card: #2d1316;
            --text-primary: #ffece8;
            --text-secondary: #d4a5a5;
            --accent-1: #ff4757;
            --accent-2: #ffa502;
            --border-color: rgba(255, 71, 87, 0.25);
            --shadow-card: 0 10px 30px rgba(255, 71, 87, 0.2);
            --header-gradient: linear-gradient(135deg, #ff4757, #ffa502);
            --button-bg: #ff4757;
            --button-text: #ffffff;
            --card-visual-bg: linear-gradient(135deg, rgba(255, 71, 87, 0.15), rgba(255, 165, 2, 0.15));
            --touch-line-gradient: linear-gradient(90deg, #ff4757, #ffa502, #ff6b81);
        }

        /* ============================================
           GLOBAL RESET
           ============================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* ============================================
           SINGLE EMOJI THEME SWITCHER BUTTON
           ============================================ */
        .theme-emoji-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-emoji-btn:active {
            transform: scale(0.85) rotate(18deg);
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            text-align: center;
            padding: 70px 20px 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: clamp(2rem, 7vw, 3.2rem);
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 8px;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: var(--font-heading);
        }

        [data-theme="brutalist"] .header h1 {
            -webkit-text-fill-color: #111111;
            text-shadow: 3px 3px 0px #ff3d00;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ============================================
           VERTICAL SINGLE-COLUMN FEED (MOBILE FIRST)
           ============================================ */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 520px;
            margin: 0 auto;
            padding: 10px 20px 40px;
        }

        /* ============================================
           INTERACTIVE REPO CARD WITH COLOR LINE & VIBRATION
           ============================================ */
        .repo-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--text-primary);
            opacity: 0;
            will-change: transform, opacity;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        [data-theme="brutalist"] .repo-card {
            border-radius: 0;
            border: 3px solid #111111;
        }

        /* TOP COLOR LINE ACTIVATION ON TOUCH/HOVER */
        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 6px;
            background: var(--touch-line-gradient);
            z-index: 10;
            transition: width 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* Touch / Active / Hover State Visual Effects */
        .repo-card:active::before,
        .repo-card.active-touch::before,
        .repo-card:hover::before {
            width: 100%;
        }

        .repo-card:active,
        .repo-card.active-touch {
            transform: scale(0.97);
            border-color: var(--accent-1);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-1);
        }

        .card-visual-banner {
            height: 90px;
            background: var(--card-visual-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            transition: background 0.3s ease;
        }

        .repo-card:active .card-visual-banner,
        .repo-card.active-touch .card-visual-banner {
            background: var(--header-gradient);
            opacity: 0.85;
        }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .repo-title {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.25;
            word-break: break-word;
            font-family: var(--font-body);
            transition: color 0.3s ease;
        }

        .repo-card:active .repo-title,
        .repo-card.active-touch .repo-title {
            color: var(--accent-1);
        }

        .repo-action {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background: var(--button-bg);
            color: var(--button-text);
            padding: 14px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 4px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        
        [data-theme="brutalist"] .repo-action {
            border-radius: 0;
            border: 2px solid #111111;
        }

        .repo-card:active .repo-action,
        .repo-card.active-touch .repo-action {
            filter: brightness(1.2);
            transform: translateX(4px);
        }

        /* ============================================
           SCROLL ANIMATIONS VARIATIONS
           ============================================ */
        .anim-fade-up { transform: translateY(60px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .anim-slide-left { transform: translateX(-80px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .anim-slide-right { transform: translateX(80px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .anim-zoom { transform: scale(0.85); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .is-visible {
            opacity: 1 !important;
            transform: translate(0) scale(1) !important;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            max-width: 520px;
            margin: 0 auto;
        }
        .footer a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Theme Switcher Button -->
    <div class="theme-emoji-btn" id="themeSwitcher">🫆</div>

    <!-- Header -->
    <header class="header">
        <h1>REPOSITORIES</h1>
        <p>MC88</p>
    </header>

    <!-- Single Column Feed -->
    <main class="feed-container" id="feedContainer"></main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 <a href="mailto:mohamed005cheikh@gmail.com">mohamed005cheikh@gmail.com</a> | MC88</p>
    </footer>

    <script>
        (function() {
            // ============================================
            // ALL REPOSITORIES (NAMES & URLS ONLY)
            // ============================================
            const REPOSITORIES = [
                { name: 'pharmacie-MC88-', url: 'https://mohamed005cheikh-rgb.github.io/pharmacie-MC88-/' },
                { name: 'Shop-MC88', url: 'https://mohamed005cheikh-rgb.github.io/Shop-MC88/' },
                { name: 'ClockMC88-', url: 'https://mohamed005cheikh-rgb.github.io/ClockMC88-/' },
                { name: 'ALL-IN', url: 'https://mohamed005cheikh-rgb.github.io/ALL-IN/' },
                { name: 'moon.c', url: 'https://mohamed005cheikh-rgb.github.io/moon.c/' },
                { name: 'RESTAURANT-MC88-', url: 'https://mohamed005cheikh-rgb.github.io/RESTAURANT-MC88-/' },
                { name: 'cabinet-isi-2', url: 'https://mohamed005cheikh-rgb.github.io/cabinet-isi-2/' },
                { name: 'ntlas', url: 'https://mohamed005cheikh-rgb.github.io/ntlas/' },
                { name: 'mohamed005cheikh-rgb', url: 'https://github.com/mohamed005cheikh-rgb/mohamed005cheikh-rgb' },
                { name: 'PIC_MC', url: 'https://mohamed005cheikh-rgb.github.io/PIC_MC/' },
                { name: 'RMC88-', url: 'https://mohamed005cheikh-rgb.github.io/RMC88-/' },
                { name: 'ATT', url: 'https://att-mc88.streamlit.app/' },
                { name: 'MP88', url: 'https://mohamed005cheikh-rgb.github.io/MP88/' },
                { name: 'DOCTOOLS', url: 'https://mohamed005cheikh-rgb.github.io/DOCTOOLS/' },
                { name: '0-click', url: 'https://mohamed005cheikh-rgb.github.io/0-click/' },
                { name: 'PC.MC', url: 'https://mohamed005cheikh-rgb.github.io/PC.MC/' },
                { name: 'BM_88', url: 'https://mohamed005cheikh-rgb.github.io/BM_88/' },
                { name: 'WSR88', url: 'https://mohamed005cheikh-rgb.github.io/WSR88/' },
                { name: 'STYLE_88', url: 'https://mohamed005cheikh-rgb.github.io/STYLE_88/' },
                { name: 'TFT-MC', url: 'https://mohamed005cheikh-rgb.github.io/TFT-MC/' },
                { name: 'SM_88', url: 'https://mohamed005cheikh-rgb.github.io/SM_88/' },
                { name: 'Data_MC', url: 'https://mohamed005cheikh-rgb.github.io/Data_MC/' }
            ];

            const THEMES = ['midnight', 'frosted', 'brutalist', 'elegant', 'cyberpunk', 'ocean', 'sunset'];
            const ANIMATIONS = ['anim-slide-right', 'anim-slide-left', 'anim-zoom', 'anim-fade-up'];

            let currentThemeIndex = 0;
            const body = document.body;
            const feedContainer = document.getElementById('feedContainer');
            const themeBtn = document.getElementById('themeSwitcher');

            // Trigger Vibration Helper
            function triggerVibration() {
                if ('vibrate' in navigator) {
                    navigator.vibrate(35); // 35ms tactile feedback
                }
            }

            // ============================================
            // BUILD SINGLE COLUMN FEED
            // ============================================
            function buildFeed() {
                feedContainer.innerHTML = '';
                const fragment = document.createDocumentFragment();

                REPOSITORIES.forEach((repo, index) => {
                    const animClass = ANIMATIONS[index % ANIMATIONS.length];

                    const card = document.createElement('a');
                    card.className = `repo-card ${animClass}`;
                    card.href = repo.url;
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";

                    card.innerHTML = `
                        <div class="card-visual-banner"></div>
                        <div class="card-content">
                            <h2 class="repo-title">${repo.name}</h2>
                            <div class="repo-action">
                                <span>Explore Project</span>
                                <span>→</span>
                            </div>
                        </div>
                    `;

                    // Touch and Vibration Event Listeners
                    card.addEventListener('touchstart', function() {
                        this.classList.add('active-touch');
                        triggerVibration();
                    }, { passive: true });

                    card.addEventListener('touchend', function() {
                        setTimeout(() => this.classList.remove('active-touch'), 250);
                    });

                    card.addEventListener('click', function() {
                        triggerVibration();
                    });

                    fragment.appendChild(card);
                });

                feedContainer.appendChild(fragment);
                setupObserver();
            }

            // ============================================
            // SCROLL OBSERVER FOR ANIMATION ON SCROLL
            // ============================================
            function setupObserver() {
                const cards = document.querySelectorAll('.repo-card');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15 });

                cards.forEach(card => observer.observe(card));
            }

            // ============================================
            // THEME SWITCHER (🫆 BUTTON) WITH VIBRATION
            // ============================================
            themeBtn.addEventListener('click', () => {
                triggerVibration();
                currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
                const themeId = THEMES[currentThemeIndex];

                if (themeId === 'midnight') {
                    body.removeAttribute('data-theme');
                } else {
                    body.setAttribute('data-theme', themeId);
                }
            });

            // Initial Build
            buildFeed();
        })();
    </script>
</body>
</html>
