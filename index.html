<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED / CHEIKH || by MC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           GLASSMORPHISM THEMES — 4 PREMIUM PALETTES
           ============================================ */
        :root {
            /* Frosted Pearl Glass (Default) */
            --bg-primary: #f5f3f0;
            --bg-secondary: #ebe8e3;
            --bg-card: rgba(255, 255, 255, 0.55);
            --bg-card-hover: rgba(255, 255, 255, 0.75);
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a6e;
            --text-muted: #9a9aaa;
            --accent-1: #8b5cf6;
            --accent-1-glow: rgba(139, 92, 246, 0.2);
            --accent-2: #ec4899;
            --accent-2-glow: rgba(236, 72, 153, 0.2);
            --accent-3: #3b82f6;
            --border-color: rgba(139, 92, 246, 0.15);
            --border-hover: rgba(139, 92, 246, 0.35);
            --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.03);
            --shadow-card-hover: 0 20px 45px rgba(0, 0, 0, 0.08), 0 0 25px rgba(139, 92, 246, 0.06);
            --header-gradient: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 35%, #ec4899 65%, #3b82f6 100%);
            --button-bg: linear-gradient(135deg, #8b5cf6, #ec4899);
            --button-text: #ffffff;
            --font-heading: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Manrope', system-ui, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --card-visual-bg: rgba(241, 240, 238, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --overlay-pattern: radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 50%),
            radial-gradient(circle at 80% 50%, rgba(236, 72, 153, 0.04) 0%, transparent 50%);
            --scrollbar-track: #e8e6e2;
            --scrollbar-thumb: #c5c0b8;
            --badge-bg: rgba(139, 92, 246, 0.1);
            --badge-text: #6d28d9;
            --blur-amount: 28px;
            --saturation: 160%;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Royal Gold Glass */
        [data-theme="elegant"] {
            --bg-primary: #faf8f4;
            --bg-secondary: #f0ece6;
            --bg-card: rgba(255, 255, 255, 0.65);
            --bg-card-hover: rgba(255, 255, 255, 0.85);
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-muted: #a8a29e;
            --accent-1: #c4a265;
            --accent-1-glow: rgba(196, 162, 101, 0.25);
            --accent-2: #8b7355;
            --accent-2-glow: rgba(139, 115, 85, 0.2);
            --accent-3: #a67c52;
            --border-color: rgba(196, 162, 101, 0.2);
            --border-hover: rgba(196, 162, 101, 0.45);
            --shadow-card: 0 15px 35px rgba(139, 115, 85, 0.08), 0 3px 10px rgba(139, 115, 85, 0.05);
            --shadow-card-hover: 0 25px 55px rgba(139, 115, 85, 0.14), 0 0 30px rgba(196, 162, 101, 0.1);
            --header-gradient: linear-gradient(135deg, #1c1917 0%, #57534e 40%, #8b7355 70%, #c4a265 100%);
            --button-bg: linear-gradient(135deg, #c4a265, #8b7355);
            --button-text: #ffffff;
            --card-visual-bg: rgba(253, 251, 247, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(196, 162, 101, 0.3);
            --overlay-pattern: radial-gradient(circle at 15% 50%, rgba(196, 162, 101, 0.05) 0%, transparent 50%),
            radial-gradient(circle at 85% 50%, rgba(139, 115, 85, 0.05) 0%, transparent 50%);
            --scrollbar-track: #f0ece6;
            --scrollbar-thumb: #c4a265;
            --badge-bg: rgba(196, 162, 101, 0.12);
            --badge-text: #8b7355;
        }

        /* Ocean Deep Glass */
        [data-theme="ocean"] {
            --bg-primary: #020a12;
            --bg-secondary: #06141e;
            --bg-card: rgba(10, 26, 40, 0.6);
            --bg-card-hover: rgba(16, 37, 54, 0.8);
            --text-primary: #e0f0ff;
            --text-secondary: #80a8c8;
            --text-muted: #406080;
            --accent-1: #007fff;
            --accent-1-glow: rgba(0, 127, 255, 0.3);
            --accent-2: #00e5ff;
            --accent-2-glow: rgba(0, 229, 255, 0.3);
            --accent-3: #7000ff;
            --border-color: rgba(0, 127, 255, 0.18);
            --border-hover: rgba(0, 229, 255, 0.4);
            --shadow-card: 0 18px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 127, 255, 0.08);
            --shadow-card-hover: 0 28px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 229, 255, 0.15);
            --header-gradient: linear-gradient(135deg, #007fff 0%, #00e5ff 50%, #7000ff 100%);
            --button-bg: linear-gradient(135deg, #007fff, #00e5ff);
            --button-text: #ffffff;
            --card-visual-bg: rgba(13, 33, 54, 0.5);
            --glass-bg: rgba(0, 127, 255, 0.04);
            --glass-border: rgba(0, 127, 255, 0.15);
            --overlay-pattern: radial-gradient(circle at 30% 50%, rgba(0, 127, 255, 0.05) 0%, transparent 50%),
            radial-gradient(circle at 70% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 50%);
            --scrollbar-track: #06141e;
            --scrollbar-thumb: #1a3a55;
            --badge-bg: rgba(0, 127, 255, 0.12);
            --badge-text: #00e5ff;
        }

        /* Sunset Ember Glass */
        [data-theme="sunset"] {
            --bg-primary: #140a0c;
            --bg-secondary: #1e1012;
            --bg-card: rgba(36, 21, 24, 0.6);
            --bg-card-hover: rgba(48, 26, 30, 0.8);
            --text-primary: #ffece8;
            --text-secondary: #d4a5a5;
            --text-muted: #906060;
            --accent-1: #ff4757;
            --accent-1-glow: rgba(255, 71, 87, 0.3);
            --accent-2: #ffa502;
            --accent-2-glow: rgba(255, 165, 2, 0.3);
            --accent-3: #ff6b81;
            --border-color: rgba(255, 71, 87, 0.18);
            --border-hover: rgba(255, 165, 2, 0.4);
            --shadow-card: 0 18px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 71, 87, 0.08);
            --shadow-card-hover: 0 28px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 165, 2, 0.15);
            --header-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 30%, #ffa502 70%, #ffca28 100%);
            --button-bg: linear-gradient(135deg, #ff4757, #ffa502);
            --button-text: #ffffff;
            --card-visual-bg: rgba(255, 71, 87, 0.08);
            --glass-bg: rgba(255, 71, 87, 0.04);
            --glass-border: rgba(255, 71, 87, 0.15);
            --overlay-pattern: radial-gradient(circle at 25% 50%, rgba(255, 71, 87, 0.05) 0%, transparent 50%),
            radial-gradient(circle at 75% 50%, rgba(255, 165, 2, 0.05) 0%, transparent 50%);
            --scrollbar-track: #1e1012;
            --scrollbar-thumb: #5a2a30;
            --badge-bg: rgba(255, 71, 87, 0.12);
            --badge-text: #ffa502;
        }

        /* ============================================
           GLOBAL RESET & BASE
           ============================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.6s var(--transition-smooth), color 0.6s var(--transition-smooth);
            overflow-x: hidden;
            padding-bottom: 40px;
            background-image: var(--overlay-pattern);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-1); }

        ::selection { background: var(--accent-1); color: #fff; }

        /* ============================================
           THEME SWITCHER — MINIMAL GLASS PILL
           ============================================ */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 6px 18px 6px 8px;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s var(--transition-smooth), box-shadow 0.3s var(--transition-smooth), border-color 0.3s var(--transition-smooth);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            backdrop-filter: blur(var(--blur-amount)) saturate(var(--saturation));
            -webkit-backdrop-filter: blur(var(--blur-amount)) saturate(var(--saturation));
        }

        .theme-switcher:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-card-hover);
            color: var(--text-primary);
        }

        .theme-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--button-bg);
            font-size: 18px;
            flex-shrink: 0;
            transition: transform 0.3s var(--transition-smooth);
        }

        .theme-switcher:hover .theme-icon-wrap {
            transform: rotate(12deg);
        }

        .theme-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            color: var(--text-secondary);
            transition: color 0.3s var(--transition-smooth);
        }

        .theme-switcher:hover .theme-label { color: var(--text-primary); }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            text-align: center;
            padding: 80px 20px 40px;
            max-width: 680px;
            margin: 0 auto;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: var(--accent-1);
            border-radius: 2px;
            opacity: 0.5;
        }

        .header-badge {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--badge-text);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            padding: 7px 20px;
            border-radius: 50px;
            margin-bottom: 18px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 10px;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: var(--font-heading);
            font-style: italic;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.72rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            font-family: var(--font-mono);
            font-weight: 500;
        }

        /* ============================================
           FEED CONTAINER
           ============================================ */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 540px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        /* ============================================
           GLASSMORPHIC REPO CARD
           ============================================ */
        .repo-card {
            position: relative;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--text-primary);
            opacity: 0;
            will-change: transform, opacity;
            transition: transform 0.4s var(--transition-smooth), border-color 0.35s ease, box-shadow 0.4s var(--transition-smooth), background 0.35s ease;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            backdrop-filter: blur(var(--blur-amount)) saturate(var(--saturation));
            -webkit-backdrop-filter: blur(var(--blur-amount)) saturate(var(--saturation));
        }

        .repo-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            box-shadow: inset 0 0 30px var(--accent-1-glow);
        }

        .repo-card:hover::after,
        .repo-card.active-touch::after { opacity: 1; }

        .repo-card:hover,
        .repo-card.active-touch {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-card-hover);
            background: var(--bg-card-hover);
        }

        .card-visual-banner {
            height: 50px;
            background: var(--card-visual-bg);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.4s ease, height 0.35s var(--transition-smooth);
        }

        .repo-card:hover .card-visual-banner,
        .repo-card.active-touch .card-visual-banner {
            height: 60px;
            background: var(--header-gradient);
            opacity: 0.7;
        }

        .card-content {
            padding: 20px 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .repo-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
            font-family: var(--font-body);
            letter-spacing: -0.3px;
            transition: color 0.3s ease;
        }

        .repo-card:hover .repo-title,
        .repo-card.active-touch .repo-title { color: var(--accent-1); }

        .repo-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .repo-card:hover .repo-meta,
        .repo-card.active-touch .repo-meta { color: var(--text-secondary); }

        .repo-meta-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-1);
            transition: transform 0.3s ease;
        }

        .repo-card:hover .repo-meta-dot,
        .repo-card.active-touch .repo-meta-dot { transform: scale(1.5); }

        .repo-action {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--button-bg);
            color: var(--button-text);
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            margin-top: 4px;
            transition: transform 0.3s var(--transition-smooth), filter 0.3s ease, box-shadow 0.3s ease;
            font-family: var(--font-body);
            position: relative;
            overflow: hidden;
        }

        .repo-action::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(-100%);
            transition: transform 0.5s var(--transition-smooth);
        }

        .repo-card:hover .repo-action::before,
        .repo-card.active-touch .repo-action::before { transform: translateX(100%); }

        .repo-card:hover .repo-action,
        .repo-card.active-touch .repo-action {
            transform: translateX(4px);
            filter: brightness(1.05);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .repo-action-arrow {
            font-size: 0.9rem;
            transition: transform 0.3s var(--transition-smooth);
        }

        .repo-card:hover .repo-action-arrow,
        .repo-card.active-touch .repo-action-arrow { transform: translateX(3px); }

        /* ============================================
           SCROLL ANIMATIONS — SMOOTH & SUBTLE
           ============================================ */
        .anim-fade-up { transform: translateY(35px); transition: opacity 0.7s var(--transition-smooth), transform 0.7s var(--transition-smooth); }
        .anim-slide-left { transform: translateX(-35px); transition: opacity 0.7s var(--transition-smooth), transform 0.7s var(--transition-smooth); }
        .anim-slide-right { transform: translateX(35px); transition: opacity 0.7s var(--transition-smooth), transform 0.7s var(--transition-smooth); }
        .anim-zoom { transform: scale(0.92); transition: opacity 0.6s var(--transition-smooth), transform 0.6s var(--transition-smooth); }

        .is-visible {
            opacity: 1 !important;
            transform: translate(0) scale(1) !important;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            text-align: center;
            padding: 28px 20px 14px;
            font-size: 0.7rem;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            max-width: 540px;
            margin: 0 auto;
            font-family: var(--font-mono);
            letter-spacing: 0.8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: color 0.3s ease;
        }
        .footer a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .footer a:hover { color: var(--accent-1); }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 600px) {
            .theme-switcher { top: 12px; right: 12px; padding: 4px 12px 4px 6px; gap: 6px; }
            .theme-icon-wrap { width: 30px; height: 30px; font-size: 15px; }
            .theme-label { font-size: 0.55rem; letter-spacing: 0.5px; }
            .header { padding: 60px 14px 30px; }
            .header h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); }
            .header-badge { font-size: 0.55rem; padding: 5px 14px; margin-bottom: 14px; }
            .header p { font-size: 0.6rem; letter-spacing: 2.5px; }
            .feed-container { padding: 14px 12px 30px; gap: 16px; }
            .card-visual-banner { height: 40px; }
            .repo-card:hover .card-visual-banner, .repo-card.active-touch .card-visual-banner { height: 50px; }
            .card-content { padding: 16px 16px 14px; gap: 8px; }
            .repo-title { font-size: 1rem; }
            .repo-action { padding: 10px 14px; font-size: 0.72rem; }
            .repo-meta { font-size: 0.55rem; gap: 7px; }
            .footer { font-size: 0.6rem; padding: 20px 14px 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .repo-card { opacity: 1; transform: none; }
        }
    </style>
</head>

                { name: 'WSR88', url: 'https://mohamed005cheikh-rgb.github.io/WSR88/' },
                { name: 'STYLE_88', url: 'https://mohamed005cheikh-rgb.github.io/STYLE_88/' },
                { name: 'TFT-MC', url: 'https://mohamed005cheikh-rgb.github.io/TFT-MC/' },
                { name: 'SM_88', url: 'https://mohamed005cheikh-rgb.github.io/SM_88/' },
                { name: 'Data_MC', url: 'https://mohamed005cheikh-rgb.github.io/Data_MC/' }
            ];

            const THEMES = [
                { id: 'frosted', label: 'Frosted Pearl' },
                { id: 'elegant', label: 'Royal Gold' },
                { id: 'ocean', label: 'Ocean Deep' },
                { id: 'sunset', label: 'Sunset Ember' }
            ];

            const ANIMATIONS = ['anim-fade-up', 'anim-slide-left', 'anim-slide-right', 'anim-zoom'];

            let currentThemeIndex = 0;
            const body = document.body;
            const feedContainer = document.getElementById('feedContainer');
            const themeBtn = document.getElementById('themeSwitcher');
            const themeLabel = document.getElementById('themeLabel');

            // ============================================
            // BUILD FEED — NO VIBRATION, SMOOTH RENDER
            // ============================================
            function buildFeed() {
                feedContainer.innerHTML = '';
                const fragment = document.createDocumentFragment();

                REPOSITORIES.forEach((repo, index) => {
                    const animClass = ANIMATIONS[index % ANIMATIONS.length];

                    const card = document.createElement('a');
                    card.className = `repo-card ${animClass}`;
                    card.href = repo.url;
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";
                    card.setAttribute('aria-label', `Open ${repo.name} repository`);

                    card.innerHTML = `
                        <div class="card-visual-banner"></div>
                        <div class="card-content">
                            <div class="repo-meta">
                                <span class="repo-meta-dot"></span>
                                <span>Project ${String(index + 1).padStart(2, '0')}</span>
                                <span>·</span>
                                <span>MC88</span>
                            </div>
                            <h2 class="repo-title">${repo.name}</h2>
                            <div class="repo-action">
                                <span>Explore</span>
                                <span class="repo-action-arrow">→</span>
                            </div>
                        </div>
                    `;

                    // Touch feedback class only (no vibration)
                    card.addEventListener('touchstart', function() {
                        this.classList.add('active-touch');
                    }, { passive: true });

                    card.addEventListener('touchend', function() {
                        setTimeout(() => this.classList.remove('active-touch'), 250);
                    });

                    fragment.appendChild(card);
                });

                feedContainer.appendChild(fragment);
                setupObserver();
            }

            // ============================================
            // SCROLL OBSERVER — EFFICIENT
            // ============================================
            function setupObserver() {
                const cards = document.querySelectorAll('.repo-card');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.08, rootMargin: '40px 0px' });

                cards.forEach(card => observer.observe(card));
            }

            // ============================================
            // THEME SWITCHER — NO VIBRATION
            // ============================================
            function updateThemeUI() {
                themeLabel.textContent = THEMES[currentThemeIndex].label;
            }

            themeBtn.addEventListener('click', () => {
                currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
                const themeId = THEMES[currentThemeIndex].id;

                if (themeId === 'frosted') {
                    body.removeAttribute('data-theme');
                } else {
                    body.setAttribute('data-theme', themeId);
                }

                updateThemeUI();
            });

            themeBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    themeBtn.click();
                }
            });

            // ============================================
            // INIT
            // ============================================
            updateThemeUI();
            buildFeed();
        })();
    </script>
</body>
</html>
